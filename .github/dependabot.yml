# Weekly version updates. The workflow actions are pinned to commit SHAs, and Dependabot
# keeps them pinned, moving the SHA and its version comment together. The nix ecosystem
# updates each flake.lock input in its own PR. Each update takes a release (for a flake
# input, a commit) at least a week old, so one pulled within days never lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
