# Weekly version updates. The workflow actions are pinned to commit SHAs, and Dependabot
# keeps them pinned, moving the SHA and its version comment together. The nix ecosystem
# updates each flake.lock input in its own PR. Semver-compatible crate updates (by
# Cargo's rule: 0.4.1 -> 0.4.2 is compatible, 0.4 -> 0.5 is not) arrive as one grouped
# PR and each breaking bump as its own, once the release is a week old.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-compatible:
        update-types:
          - minor
          - patch
