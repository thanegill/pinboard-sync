name: Release

# Cutting a release is a single action: push a semver tag from master.
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# This workflow then does the bookkeeping a release needs: it stamps the tag's
# version into Cargo.toml / Cargo.lock (the Nix package reads it from Cargo.toml),
# rolls the changelog's [Unreleased] section over to that version, commits the
# result back to master, builds the binary through the flake (which also runs the
# test suite), and publishes a GitHub release with the changelog section as its
# notes. You never hand-edit a version number.
#
# A manual run (`gh workflow run release.yml -f rehearse=true`, or "Run workflow"
# in the Actions tab) rehearses all of that against throwaway refs instead: the
# bump goes to a `release-rehearsal/<run-id>` branch and the tags to
# `rehearsal-<run-id>` and `rehearsal-<run-id>-latest`, all deleted again at the
# end, and the GitHub release is skipped. It never touches master, a `v*` tag or
# `latest`. Every push goes through one helper that sends the job token in a
# per-command header, and the checkout keeps none.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      rehearse:
        description: Rehearse against throwaway refs (a manual run can only rehearse)
        type: boolean
        required: true
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump and the tags, and create the release
    env:
      REHEARSE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Refuse a manual run that is not a rehearsal
        if: github.event_name == 'workflow_dispatch' && !inputs.rehearse
        run: |
          echo "A release is cut by pushing a v* tag; a manual run can only rehearse." >&2
          exit 1

      # Check out the branch, not the detached tag, so we can commit the bump back.
      - name: Check out master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      # `git-with-token push ...` and `git-with-token ls-remote ...` send the job token in
      # a header for that one command, so it is never written to .git/config. In a
      # rehearsal it runs only those two commands, with no option but --force and
      # --delete, and accepts only this run's three rehearsal refs. The header's base64
      # form is masked here in full, once for the job.
      - name: Set up token-authenticated pushes
        id: token-helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::add-mask::$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/git-with-token" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${GH_TOKEN:?git-with-token needs GH_TOKEN}"
          if [[ $REHEARSE == true ]]; then
            case $1 in
              push | ls-remote) ;;
              *)
                echo "refusing git $1 in a rehearsal" >&2
                exit 1
                ;;
            esac
            branch="refs/heads/release-rehearsal/$GITHUB_RUN_ID"
            tag="refs/tags/rehearsal-$GITHUB_RUN_ID"
            named_refs=0
            for arg in "${@:2}"; do
              case $arg in
                --force | --delete | origin) continue ;;
              esac
              case ${arg#HEAD:} in
                "$branch" | "$tag" | "$tag-latest") named_refs=$((named_refs + 1)) ;;
                *)
                  echo "refusing to touch $arg in a rehearsal" >&2
                  exit 1
                  ;;
              esac
            done
            if ((named_refs == 0)); then
              echo "refusing a rehearsal $1 that names no rehearsal ref" >&2
              exit 1
            fi
          fi
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          exec git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/bin/git-with-token"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A rehearsal stands in a throwaway version, branch and tags for the real ones.
      - name: Compute version, date and refs
        id: meta
        run: |
          if [[ $REHEARSE == true ]]; then
            version="0.0.0-rehearsal.$GITHUB_RUN_ID"
            bump_ref="refs/heads/release-rehearsal/$GITHUB_RUN_ID"
            tag="rehearsal-$GITHUB_RUN_ID"
            latest_tag="rehearsal-$GITHUB_RUN_ID-latest"
          else
            version="${GITHUB_REF_NAME#v}"
            bump_ref=master
            tag="$GITHUB_REF_NAME"
            latest_tag=latest
          fi
          {
            echo "version=$version"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "bump_ref=$bump_ref"
            echo "tag=$tag"
            echo "latest_tag=$latest_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp the version into every manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Cargo.toml: the package version is the first `version = "..."` line.
          sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          # Cargo.lock: the version line directly under this crate's package entry.
          sed -i "/^name = \"pinboard-sync\"/{n;s/^version = .*/version = \"$VERSION\"/}" Cargo.lock

      - name: Roll over the changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          # Promote [Unreleased] to the new version and open a fresh, empty one.
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          # Point the Unreleased compare link at the new tag, and add the release link.
          sed -i -E "s|^\[Unreleased\]: .*|[Unreleased]: https://github.com/${GITHUB_REPOSITORY}/compare/v$VERSION...HEAD|" CHANGELOG.md
          sed -i "/^\[Unreleased\]: /a [$VERSION]: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION" CHANGELOG.md

      - name: Extract release notes for this version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Everything between this version's heading and the next section: either
          # the following `## [` heading or the link-reference block at the bottom
          # (`[Unreleased]: ...`), whichever comes first.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^\[[^][]+\]: /) { exit }
            grab { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' -e ':a' -e '/^\n*$/{$d;N;ba}' > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      # Commit before building, so the released binary is built from exactly the
      # commit pushed to master.
      - name: Commit the version bump and changelog
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release v$VERSION"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Builds the binary and runs the (sandbox-safe) test suite via doCheck.
      - name: Build the release binary
        run: nix build .#default --print-build-logs

      - name: Stage the binary artifact
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist
          cp result/bin/pinboard-sync "dist/pinboard-sync-v$VERSION-x86_64-linux"

      # Only after a green build do we publish anything externally.
      - name: Push the bump to master (in a rehearsal, its own branch)
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_REF: ${{ steps.meta.outputs.bump_ref }}
        run: git-with-token push origin "HEAD:$BUMP_REF"

      # Point both the version tag and the rolling `latest` tag at the stamped release
      # commit (the bump pushed above), so a consumer tracking `latest` resolves to a
      # commit that also carries its `vX.Y.Z` tag. Force-pushed with GITHUB_TOKEN, which
      # can't trigger another workflow run — so re-pointing the `vX.Y.Z` tag here (it does
      # match the release trigger) does not re-run this workflow.
      - name: Point the version tag and `latest` at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
        run: |
          git tag -f "$TAG"
          git tag -f "$LATEST_TAG"
          git-with-token push --force origin "refs/tags/$TAG" "refs/tags/$LATEST_TAG"

      - name: Create the GitHub release
        if: env.REHEARSE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/*

      # Named from the run id rather than the meta step's outputs, so a run that failed
      # before (or in) that step still cleans up. Every push needs the helper, so with no
      # helper there is nothing to delete.
      - name: Delete the rehearsal refs
        if: always() && env.REHEARSE == 'true' && steps.token-helper.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=(
            "refs/heads/release-rehearsal/$GITHUB_RUN_ID"
            "refs/tags/rehearsal-$GITHUB_RUN_ID"
            "refs/tags/rehearsal-$GITHUB_RUN_ID-latest"
          )
          remote=$(git-with-token ls-remote origin "${refs[@]}")
          mapfile -t present < <(cut -f2 <<<"$remote" | grep -v '^$' || true)
          if ((${#present[@]})); then
            git-with-token push origin --delete "${present[@]}"
          fi
