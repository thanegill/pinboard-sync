[package]
name = "pinboard-sync"
version = "0.3.3"
edition = "2021"
description = "Sync saved/favorited items from multiple services to a Pinboard account"
license = "MIT"

[[bin]]
name = "pinboard-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# join_all: fetch sources concurrently on one task (no Send bound, no spawn).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Why native-tls, not rustls: Reddit's anti-bot edge rejects rustls's TLS ClientHello
# fingerprint (403 on the saved listing) but accepts native-tls's, so the HTTP client
# is built with native-tls. On Linux that pulls in OpenSSL (hence pkg-config + openssl
# at build time); on macOS it uses the Security framework. See CLAUDE.md.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
scraper = "0.20"
dotenvy = "0.15"
clap_mangen = "0.2"

[dev-dependencies]
http = "1"
wiremock = "0.6"
