[package]
name = "pinboard-sync"
version = "0.7.0"
edition = "2021"
# str::floor_char_boundary
rust-version = "1.91"
description = "Sync saved/favorited items from multiple services to a Pinboard account"
license = "MIT"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Durations stay in the unit the docs give them in, seconds. Nothing hits it yet; it keeps a
# later wait of over ten minutes, written in seconds, from being converted.
duration_suboptimal_units = "allow"
# `|a| a.limit()` reads better than the `config::Account::limit` path it would become.
redundant_closure_for_method_calls = "allow"
# Pairs such as `stored` and `stores` name related things on purpose.
similar_names = "allow"
# An impl of an async port is an `async fn` like its trait, whether or not it awaits.
unused_async_trait_impl = "allow"
# `format!` then `collect` reads better than `fold` and `write!`, and no such build is hot.
format_collect = "allow"
# Restriction picks: `#[expect]` rather than `#[allow]`, so a suppression that stops firing
# is noticed; no `dbg!` or `todo!` left in; no `unwrap` outside tests (see clippy.toml);
# output through `stdout.rs`, since `println!` panics on a closed pipe, and messages
# through `log`.
allow_attributes = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
# Restriction picks the code already meets, so it keeps meeting them: no stub that panics,
# no `process::exit` that skips destructors, no `for` over a hash map or set, whose order
# is unspecified, `foo.rs` beside `foo/` rather than `foo/mod.rs`, and the plainer form of
# the rest. A serde struct keeps `{}` with an `#[expect]`: as `struct X;` it no longer
# parses from an empty table.
allow_attributes_without_reason = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mod_module_files = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
# An error is handled, not dropped: no `expect` outside tests either, no `map_err(|_| ..)`
# that loses the cause, no `let _ =` on a `#[must_use]` value, and no `unwrap` or `expect`
# where `?` would pass the error on.
expect_used = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unwrap_in_result = "warn"
# Make casts, clones and catch-alls explicit, and test the real code: no `as` (a lossy or
# sign-changing cast hides there), an `Rc::clone` rather than a `.clone()` that reads like
# a deep copy, no `_` arm that would swallow a new enum variant, and no `cfg(not(test))`
# that leaves the real code untested.
as_conversions = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
wildcard_enum_match_arm = "warn"
# Named style picks (four nursery, plus restriction's `str_to_string`), not the whole
# nursery group: that would bring in `future_not_send`, and the client futures are not
# `Send` by design.
missing_const_for_fn = "warn"
option_if_let_else = "warn"
redundant_pub_crate = "warn"
str_to_string = "warn"
use_self = "warn"
# No `[]` string slice off a char boundary, `[]` index past the end, or bare `panic!`
# outside tests. A site proven safe says so in an `#[expect]`.
indexing_slicing = "warn"
panic = "warn"
string_slice = "warn"

[[bin]]
name = "pinboard-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt", "time"] }
# join_all: fetch sources concurrently on one task (no Send bound, no spawn).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Why native-tls, not rustls: Reddit's anti-bot edge rejects rustls's TLS ClientHello
# fingerprint (403 on the saved listing) but accepts native-tls's, so the HTTP client
# is built with native-tls. On Linux that pulls in OpenSSL (hence pkg-config + openssl
# at build time); on macOS it uses the Security framework.
# native-tls-alpn: the edge also rejects a ClientHello with no ALPN extension (#78).
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "native-tls", "native-tls-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", default-features = false, features = ["retry", "util"] }
toml = "1.1"
url = "2"
dotenvy = "0.15"
clap_mangen = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
# Source post date -> Pinboard `dt`: epoch <-> RFC3339 conversion + `now`.
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
# HN note bodies are raw HTML (Algolia story_text/comment_text); htmd converts them to
# Markdown. Pure-Rust, built on html5ever and markup5ever_rcdom.
htmd = "0.5"
# Favorites pages and titles. Keep on htmd's versions, or a second html5ever returns.
html5ever = "0.38"
markup5ever_rcdom = "0.38"
# An insertion-ordered set for a bookmark's tags; already in the build through h2.
indexmap = "2"

[dev-dependencies]
h2 = "0.4"
http = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "test-util"] }
wiremock = "0.6"
