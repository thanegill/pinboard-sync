[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Every test is offline, so only production would see a switch to rustls.
    { crate = "rustls", reason = "Reddit's edge 403s rustls's TLS fingerprint, so reqwest is built with native-tls" },
    # Kept on htmd's versions (Cargo.toml). A second copy still compiles, so only
    # this ban catches it.
    { crate = "html5ever", deny-multiple-versions = true },
    { crate = "markup5ever_rcdom", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
