# pinboard-sync configuration.
#
# Pass with `--config <path>` or PINBOARD_SYNC_CONFIG. Every field is optional. A secret
# field takes an inline value or a `<field>_file` path whose trimmed contents are the
# value. A secret resolves CLI flag > $ENV > $ENV_FILE > inline > *_file.

# Shell command run when a source needs re-authentication (e.g. an expired Reddit
# cookie), via `/bin/sh -c` (else `sh` from PATH), with PINBOARD_SYNC_AUTH_ERROR and
# PINBOARD_SYNC_EVENT set. A reddit or github account can override it. Under the NixOS
# module, see its `onAuthFailure` option for the sandbox the hook runs in. ntfy.sh
# topics are public, so pick a long random one.
[hooks]
# on_auth_failure = 'curl -fsS -d "pinboard-sync needs re-authentication: $PINBOARD_SYNC_AUTH_ERROR" https://ntfy.sh/YOUR-LONG-RANDOM-TOPIC'

# The Pinboard account every source writes to.
[pinboard]
# token = "user:0123456789ABCDEF"        # or:
# token_file = "/run/secrets/pinboard-token"
public = false                           # write bookmarks public
toread = false                           # mark new bookmarks unread
rate_limit_secs = 3                      # seconds between posts/add writes
# limit = "auto"                         # "auto", "all", or a cap on new bookmarks per run
use_post_date = false                    # date bookmarks by the source post date
post_date_max_age_days = 30              # only backdate posts this recent; older use now
cleanup_stale_to_now = false             # true: cleanup re-dates older posts to now

# Where `backup` writes `raw/` (API responses, every field kept), `normalized/` and
# `manifest.json`. Each run overwrites the last snapshot. `--out` overrides this.
[backup]
# directory = "/var/lib/pinboard-sync/backup"

# Per-source defaults: CLI > account > [defaults.<source>] > global. Takes toread,
# public, limit, on_auth_failure, use_post_date, post_date_max_age_days and
# cleanup_stale_to_now. A github post date is the star date.
[defaults.reddit]
# use_post_date = true
[defaults.github]
# use_post_date = true
# gist_post_date = "now"                 # a gist's post date: "now", "created" or "updated"
[defaults.hackernews]
# use_post_date = true

# A reddit account. Repeat [[reddit]] per account; pick one with `sync reddit <name>`,
# or run all with `sync reddit --all`. The same goes for [[github]] and [[hackernews]].
[[reddit]]
name = "main"                            # optional selector; defaults to `username`
# username = "your-reddit-username"      # non-secret; whose saved.json to read
# cookie = "reddit_session=..."          # or:
# cookie_file = "/run/secrets/reddit-cookie"
# Overrides for this account:
# on_auth_failure = "..."
# limit = "auto"
# toread = true
# public = true
# use_post_date = true
# post_date_max_age_days = 7
# cleanup_stale_to_now = true

# Tags, set only here; each shows its default. "" disables a prefixed or conditional
# tag. Setting `tags` replaces the default, so include the base tag.
reddit_domain = "old.reddit.com"         # host for bookmark/thread URLs
tags = ["reddit"]                        # on every bookmark
tag_subreddit_prefix = "subreddit:"      # subreddit:<sub>
tag_comment = "reddit-comment"           # added to comments
tag_nsfw = "nsfw"                        # added when the post is over_18
tag_author_prefix = "author:reddit:"     # author:reddit:<name>
tag_flair_prefix = "reddit-flair:"       # reddit-flair:<slug>
tag_media_prefix = "type:"               # type:image / type:video
tag_media_types = ["image", "video"]     # which media types get a type:<x> tag ([] = none)

# A GitHub account (starred repos and gists).
[[github]]
name = "personal"                        # selector; GitHub has no username to default to
# token = "ghp_..."                      # a personal access token, or:
# token_file = "/run/secrets/github-token"
# Overrides for this account:
# on_auth_failure = "..."
# limit = "auto"
# toread = true
# public = true
# use_post_date = true
# post_date_max_age_days = 7
# cleanup_stale_to_now = true
tags = ["github-star"]                   # on every bookmark
tag_lang_prefix = "lang:"                # lang:<language>
tag_author_prefix = "author:github:"     # author:github:<owner>
# Each gist_* key defaults to its star counterpart; gist_tags to `tags` + "github-gist".
# gists = true                           # false: don't read the starred gists
# gist_tags = ["github-star", "github-gist"]
# gist_tag_lang_prefix = "lang:"         # lang:<language>, one per distinct file language
# gist_tag_author_prefix = "author:github:"
# gist_post_date = "now"                 # override [defaults.github].gist_post_date

# A HackerNews account (public favorites by username).
[[hackernews]]
name = "me"                              # optional selector; defaults to `username`
# username = "your-hn-username"          # public; whose favorites to read (env HN_USERNAME)
# Overrides for this account:
# limit = "auto"
# toread = true
# public = true
# use_post_date = true
# post_date_max_age_days = 7
# cleanup_stale_to_now = true
tags = ["hackernews"]                    # on every bookmark
tag_comment = "hackernews-comment"       # added to favorited comments
tag_author_prefix = "author:hackernews:" # author:hackernews:<name>
tag_special_prefix = "hackernews:"       # "Show HN:" -> hackernews:show-hn; also Ask/Tell/Launch
tag_link = "find-hn"                      # marker tag for `cleanup hackernews --link-discussions`
